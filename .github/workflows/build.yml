name: Build and Release QGIS Plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build plugin
        run: python build.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MitiConnect
          path: MitiConnect.zip

      - name: Get plugin version
        id: metadata
        run: |
          VERSION=$(grep '^version=' metadata.txt | cut -d '=' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.metadata.outputs.version }}

          gh release create "v${VERSION}" \
            MitiConnect.zip \
            plugins.xml \
            --title "MitiConnect v${VERSION}" \
            --notes "Release MitiConnect v${VERSION}" \
            --latest \
          || gh release upload "v${VERSION}" MitiConnect.zip plugins.xml --clobber

      - name: Prepare GitHub Pages content
        run: |
          mkdir -p public
          cp plugins.xml public/

      - name: Publish plugins.xml
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
