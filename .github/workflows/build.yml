name: Build and Release QGIS Plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build plugin
        run: python build.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MitiConnect
          path: MitiConnect.zip
          
      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
      
          # Crée le tag s'il n'existe pas
          git tag -f latest
          git push origin latest --force
      
          # Crée ou met à jour la release
          gh release create latest MitiConnect.zip \
            --title "Latest build" \
            --notes "Dernière version" \
            --latest \
            || gh release upload latest MitiConnect.zip --clobber
